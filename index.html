<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hotel Murder</title>
<style>
:root{--bg:#f6f3ee;--card:#fff;--tx:#1d1b19;--mu:#6d675f;--ac:#b3261e;--bd:#ddd6cb;--ok:#2e7d4f;
 --se:#2e7d4f;--sm:#c62828;--sj:#e06c00;--sb:#8a8580;color-scheme:light}
@media(prefers-color-scheme:dark){:root{--bg:#17151a;--card:#232027;--tx:#eee9e2;--mu:#a49d94;--ac:#ff6b60;--bd:#3a353d;--ok:#6fcf97;
 --se:#2f8a57;--sm:#d64545;--sj:#e8811f;--sb:#615c57;color-scheme:dark}}
*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
#app{max-width:760px;margin:0 auto;padding:14px}
h1{font-family:Georgia,serif;margin:.2em 0}h3{margin:.2em 0 .5em}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin:10px 0}
.mu{color:var(--mu);font-size:.9em}
button,input,select{font:inherit;color:var(--tx)}
button{background:var(--ac);color:#fff;border:0;border-radius:8px;padding:9px 14px;cursor:pointer}
button.s{background:var(--card);color:var(--tx);border:1px solid var(--bd)}
button.on{outline:3px solid var(--ok)}button:disabled{opacity:.4;cursor:default}
input,select{background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:9px;width:100%;margin:4px 0}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.bld{display:grid;gap:4px;max-width:340px}
.fl{display:grid;grid-template-columns:28px repeat(3,1fr);gap:4px;align-items:center}
.fl button{padding:7px 0}.fl span{font-size:.8em;color:var(--mu);text-align:center}
.rm{background:var(--card);color:var(--tx);border:1px solid var(--bd)}
.st-empty,.st-murdered,.st-mob,.st-body{color:#fff;border:1px solid transparent}
.st-empty{background:var(--se)}.st-murdered{background:var(--sm)}.st-mob{background:var(--sj)}.st-body{background:var(--sb)}
.fl button.st-empty:disabled,.fl button.st-murdered:disabled,.fl button.st-mob:disabled,.fl button.st-body:disabled{opacity:1}
.tag{display:inline-block;padding:2px 9px;border-radius:99px;border:1px solid var(--bd);margin:2px}
.tag .x{background:none;color:var(--mu);border:0;padding:0 0 0 6px}
.dead{text-decoration:line-through;color:var(--mu)}
.err{color:var(--ac)}
ul{padding-left:20px;margin:.3em 0}.big{font-size:2em;font-weight:700;letter-spacing:.1em}
.cfg{border-collapse:collapse;margin:6px 0}.cfg td,.cfg th{padding:3px 8px 3px 0;text-align:left}
.cfg button{padding:2px 12px}.cfg td.n{min-width:2em;text-align:center;font-weight:600}
</style></head><body><div id="app">Loading…</div>
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
/* Hotel Murder — serverless. The room host's browser is the game server (PeerJS/WebRTC).
   Free PeerJS cloud is used only for the initial handshake. */
const $app=document.getElementById('app');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ls=(k,v)=>{try{if(v===undefined)return localStorage.getItem(k);v===null?localStorage.removeItem(k):localStorage.setItem(k,v)}catch(e){}};
let LANG=ls('hm_lang')||'en';
const L=(en,th)=>LANG==='th'?th:en;
const ROLES={
hid:{t:'?',k:'none',n:{en:'?',th:'?'},d:{en:'',th:''}},
civ:{t:'c',k:'none',n:{en:'Civilian',th:'พลเรือน'},d:{en:'No night ability. Find the Murderer.',th:'ไม่มีความสามารถตอนกลางคืน จงตามหาฆาตกร'}},
drunk:{t:'d',k:'room',n:{en:'Drunk',th:'คนเมา'},d:{en:'First each night: choose a room and sleep there. You win if the mob sends you away.',th:'ทุกคืนคุณได้เลือกก่อนใคร: เลือกห้องแล้วเข้านอนที่นั่น คุณชนะถ้าถูกฝูงชนลงประชาทัณฑ์ขับไล่ออกจากเกม'}},
lock:{t:'c',k:'room',n:{en:'Locksmith',th:'ช่างกุญแจ'},d:{en:"Lock one room each night. If the Murderer targets that room, or it is the Murderer's own room, nobody dies tonight. Not the same room two nights in a row.",th:'ล็อกห้องหนึ่งห้องทุกคืน ถ้าฆาตกรเลือกห้องนั้นเป็นเป้าหมาย หรือเป็นห้องของฆาตกรเอง คืนนั้นจะไม่มีใครตาย ห้ามล็อกห้องเดิมสองคืนติดกัน'}},
house:{t:'c',k:'floor',n:{en:'Housekeeper',th:'แม่บ้าน'},d:{en:'Choose a floor: learn how many people sleep there tonight.',th:'เลือกชั้น: จะรู้ว่าคืนนี้มีคนนอนอยู่ที่ชั้นนั้นกี่คน'}},
rac:{t:'c',k:'col',n:{en:'Window Washer',th:'คนเช็ดกระจก'},d:{en:'Choose a building (A, B or C): learn how many people sleep in it tonight.',th:'เลือกตึก (A, B หรือ C): จะรู้ว่าคืนนี้มีคนนอนอยู่ในตึกนั้นกี่คน'}},
det:{t:'c',k:'person',n:{en:'Detective',th:'นักสืบ'},d:{en:'Choose a person: learn which floor they sleep on.',th:'เลือกคน: จะรู้ว่าคนนั้นนอนอยู่ชั้นไหน'}},
asst:{t:'m',k:'person',n:{en:'Assistant',th:'ผู้ช่วย'},d:{en:'Choose a person: learn their floor. Your team sees it immediately, before the Murderer acts.',th:'เลือกคน: จะรู้ชั้นที่คนนั้นนอนอยู่ และทีมของคุณจะเห็นข้อมูลนี้ทันทีก่อนฆาตกรลงมือ'}},
murd:{t:'m',k:'room',n:{en:'Murderer',th:'ฆาตกร'},d:{en:"Last each night, after your team's intel: choose a room. Anyone inside dies, unless a Locksmith locked that room or your own room.",th:'ทุกคืนคุณลงมือเป็นคนสุดท้าย หลังได้ข้อมูลจากทีม: เลือกห้อง ทุกคนในห้องนั้นจะตาย เว้นแต่ช่างกุญแจล็อกห้องนั้นหรือห้องของคุณไว้'}},
wit:{t:'c',k:'floor',n:{en:'Witness',th:'พยาน'},d:{en:'Choose a floor: if a room there is targeted by the murderer, learn whether the murderer sleeps on that floor, a lower or a higher one.',th:'เลือกชั้น: ถ้าฆาตกรเลือกเป้าหมายเป็นห้องในชั้นนั้น จะรู้ว่าฆาตกรนอนอยู่ชั้นเดียวกัน ชั้นที่ต่ำกว่า หรือชั้นที่สูงกว่า'}}};
const RK=['civ','drunk','lock','house','rac','det','asst','wit']; // configurable roles (Murderer is always exactly 1)
const rn=r=>r.n[LANG],rd=r=>r.d[LANG];
const TEAM={c:{en:'Civilians',th:'พลเรือน'},m:{en:'Murderers',th:'ฆาตกร'},d:{en:'Drunk',th:'คนเมา'}};
const tm=k=>TEAM[k][LANG];
const SL={empty:{g:'∅',n:{en:'Empty',th:'ห้องว่าง'}},murdered:{g:'🔪',n:{en:'Murdered',th:'ถูกฆาตกรรม'}},mob:{g:'⚖',n:{en:'Mob Justice',th:'ประชาทัณฑ์'}},body:{g:'💀',n:{en:'Body Found',th:'พบศพ'}}};
const fl=r=>Math.floor(r/100);
const bn=c=>'ABC'[c-1];            // building letter
const rl=r=>bn(r%100)+fl(r);       // room label: 101 -> A1, 203 -> C2
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const rand=n=>Array.from({length:n},()=>'ABCDEFGHJKLMNPQRSTUVWXYZ'[Math.floor(Math.random()*24)]).join('');
const clone=o=>JSON.parse(JSON.stringify(o));
const defCfg=()=>{const c={};RK.forEach(r=>c[r]=1);return c};
const okCfg=c=>c&&RK.every(r=>Number.isInteger(c[r])&&c[r]>=0&&c[r]<=9);
function loadCfg(){try{const c=JSON.parse(ls('hm_cfg'));if(okCfg(c))return c}catch(e){}return defCfg()}
const poolSize=cfg=>RK.reduce((s,r)=>s+cfg[r],0);
function cfgErr(cfg,n){
 const p=poolSize(cfg);
 if(p<n-1)return L('The role pool has only '+p+' roles; '+n+' players need '+(n-1)+'.','กองบทบาทมีเพียง '+p+' บทบาท แต่ผู้เล่น '+n+' คนต้องใช้ '+(n-1)+' บทบาท');
 return '';
}

let uid=ls('hm_uid')||('u'+rand(10)),name=ls('hm_name')||'',code='',isHost=false,peer,conn,conns={};
let HG=null,HP={},force=false,tmr=null;   // host-only: true state
let G=null,P={},mine={},sel=null,selKey='';  // what the UI shows
ls('hm_uid',uid);

/* ---------- networking ---------- */
function startHost(c,resume){
 code=c;isHost=true;ls('hm_code',code);ls('hm_host','1');ls('hm_name',name);
 peer=new Peer('hm-'+code);
 peer.on('error',e=>{if(e.type==='unavailable-id'&&!resume)startHost(rand(4));else alert(L('Network error: ','เกิดข้อผิดพลาดเครือข่าย: ')+e.type)});
 peer.on('open',()=>{
  if(!resume){HG={host:uid,phase:'lobby',cfg:loadCfg(),banned:[]};HP={[uid]:{name}}}
  else migrate();
  mine=HP[uid];tick();
 });
 peer.on('connection',cn=>{
  cn.on('data',m=>{
   if(m.t==='join'){
    if((HG.banned||[]).includes(m.uid))return cn.send({t:'err',m:'kicked'});
    const known=HP[m.uid]||(HG.pl&&HG.pl[m.uid]);
    if(!known&&(HG.phase!=='lobby'||Object.keys(HP).length>=9))return cn.send({t:'err',m:HG.phase!=='lobby'?'started':'full'});
    cn.u=m.uid;conns[m.uid]=cn;HP[m.uid]=HP[m.uid]||{};HP[m.uid].name=m.name;tick();
   }else if(cn.u&&conns[cn.u]===cn)onMsg(cn.u,m);
  });
 });
}
function migrate(){ // fill in fields missing from saves made by older versions
 if(!okCfg(HG.cfg))HG.cfg=loadCfg();HG.banned=HG.banned||[];
 if(HG.pl){HG.props=HG.props||[];HG.seen=HG.seen||{};if(!HG.lastLock||typeof HG.lastLock!=='object')HG.lastLock={};
  if(HG.phase==='night'&&!HG.np)startNight(HG)}
}
function startClient(c){
 code=c.toUpperCase().trim();ls('hm_code',code);ls('hm_host','0');ls('hm_name',name);isHost=false;
 peer=new Peer();
 peer.on('error',e=>{if(e.type==='peer-unavailable'){alert(L('Room not found. Check the code.','ไม่พบห้อง กรุณาตรวจสอบรหัส'));leave()}});
 peer.on('open',connect);
 render();
}
function connect(){
 conn=peer.connect('hm-'+code,{reliable:true});
 conn.on('open',()=>conn.send({t:'join',uid,name}));
 conn.on('data',m=>{
  if(m.t==='s'){G=m.G;P=m.P;if(!mine.name)mine={...(P[uid]||{}),name};render()}
  else if(m.t==='err'){alert({started:L('This game has already started.','เกมนี้เริ่มไปแล้ว'),full:L('The room is full.','ห้องนี้เต็มแล้ว'),kicked:L('The host removed you from this room.','คุณถูกโฮสต์เชิญออกจากห้องนี้')}[m.m]);leave()}
 });
 conn.on('close',()=>{G=null;render();setTimeout(()=>{if(peer&&!peer.destroyed)connect()},2000)});
}
function push(){if(isHost)onMsg(uid,{t:'mine',m:mine});else if(conn&&conn.open)conn.send({t:'mine',m:mine})}
function leave(){['hm_code','hm_host','hm_save'].forEach(k=>ls(k,null));location.reload()}
function kick(u){
 if(!isHost||HG.phase!=='lobby'||u===uid)return;
 HG.banned.push(u);delete HP[u];const c=conns[u];delete conns[u];
 if(c){try{c.send({t:'err',m:'kicked'})}catch(e){}setTimeout(()=>{try{c.close()}catch(e){}},500)}
 tick();
}

/* ---------- host engine ---------- */
function onMsg(u,m){
 if(m.t==='mine'&&HP[u]){const x=m.m||{};HP[u]={name:HP[u].name,act:x.act,votes:x.votes,props:x.props,skip:x.skip};tick()}
}
function sg(u){ // what player u may see
 const o=clone(HG),end=HG.phase==='end',me=HG.pl&&HG.pl[u],mt=me&&ROLES[me.role].t==='m';
 const omni=end||(me&&!me.alive); // dead players (and end-of-game) see everything
 ['seen','dpos','acts','wait','ainfo','banned','lastLock'].forEach(k=>delete o[k]);
 o.info=omni?(HG.info||{}):{[u]:(HG.info||{})[u]||[]};
 o.lastLock=me&&me.role==='lock'?(HG.lastLock||{})[u]||null:null;
 if(HG.pl){o.pl={};for(const k in HG.pl){const p=HG.pl[k],show=omni||k===u,pmt=mt&&ROLES[p.role].t==='m';
  o.pl[k]={name:p.name,alive:p.alive,role:show||pmt?p.role:'hid',room:show?p.room:0}}}
 return o;
}
function sp(){ // public per-player info. Night actions are shown only for step 2 (everyone acts then).
 const o={};for(const k in HP){const p=HP[k];o[k]={name:p.name};
  if(p.act&&p.act.p===2)o[k].act={n:p.act.n,p:2};if(p.votes)o[k].votes=p.votes;if(p.skip)o[k].skip=p.skip}
 return o;
}
function tick(){
 let i=0;while(step()&&i++<20);force=false;broadcast();
 clearTimeout(tmr);
 if(HG&&HG.phase==='night'&&HG.wait)tmr=setTimeout(tick,Math.max(0,HG.wait-Date.now())+50);
}
function broadcast(){
 ls('hm_save',JSON.stringify({HG,HP}));
 for(const u in conns){try{if(conns[u].open)conns[u].send({t:'s',G:sg(u),P:sp()})}catch(e){}}
 G=sg(uid);P=sp();if(HP[uid])mine={...HP[uid],...mine,name};render();
}
const alive=g=>Object.keys(g.pl).filter(u=>g.pl[u].alive);
const isM=(g,u)=>ROLES[g.pl[u].role].t==='m';
const posOf=(g,u)=>g.dpos&&g.dpos[u]!=null?g.dpos[u]:g.pl[u].room; // tonight's sleeping room (Drunk may move)
const addInfo=(g,u,k,p)=>{(g.info[u]=g.info[u]||[]).push({n:g.night,k,p})};
function step(){
 if(!HG||HG.phase==='lobby'||HG.phase==='end')return false;
 const g=clone(HG);let ch=false;
 const al=alive(g),A=u=>HP[u]||{},has=r=>al.filter(u=>g.pl[u].role===r);
 if(g.phase==='night'){
  const N=g.night,act=u=>{const a=A(u).act;return a&&a.n===N&&a.p===g.np?a:null};
  if(g.np===1){ // Drunk(s) move
   const dr=has('drunk');
   if(dr.length?(force||dr.every(act)):(force||Date.now()>=g.wait)){
    dr.forEach(u=>{const a=act(u);if(a&&a.v)g.dpos[u]=a.v});
    force=false;g.np=2;g.wait=0;ch=true}
  }else if(g.np===2){ // everyone else; Assistant intel is shared with the team immediately
   const team=al.filter(u=>isM(g,u));
   has('asst').forEach(u=>{const a=act(u);if(a&&!g.ainfo[u]){g.ainfo[u]=1;ch=true;
    if(g.pl[a.v]&&g.pl[a.v].alive)team.forEach(x=>addInfo(g,x,'infoAsst',{name:g.pl[a.v].name,floor:fl(posOf(g,a.v))}))}});
   if(force||al.every(act)){al.forEach(u=>{const a=act(u);if(a)g.acts[u]=a.v});force=false;g.np=3;ch=true}
  }else{ // Murderer acts last
   const m=has('murd')[0],a=m&&act(m);
   if(force||!m||a){force=false;resolve(g,a?a.v:null);ch=true}
  }
 }else if(g.phase==='day'){
  for(const u of al)for(const p of (A(u).props||[])){
   if(p.seq>(g.seen[u]||0)){g.seen[u]=p.seq;ch=true;
    if(!g.st[p.room]&&!g.props.some(x=>x.room===p.room)&&fl(p.room)>=1&&fl(p.room)<=g.n)g.props.push({id:u+':'+p.seq,room:p.room,by:u})}}
  for(const pr of [...g.props]){
   const vs=al.map(u=>(A(u).votes||{})[pr.id]);
   if(vs.every(v=>v===true||v===false)){ch=true;
    if(vs.filter(v=>v).length*2>al.length){execMob(g,pr);break}
    g.log.push({k:'mobRejected',p:{room:pr.room}});g.props=g.props.filter(x=>x!==pr)}
  }
  if(g.phase==='day'&&(force||al.filter(u=>A(u).skip===g.day).length*2>al.length)){force=false;g.log.push({k:'noMob'});endDay(g);ch=true}
 }
 if(ch)HG=g;return ch;
}
function checkWin(g){
 const al=alive(g),m=al.filter(u=>isM(g,u)).length;
 if(!al.some(u=>g.pl[u].role==='murd'))g.winner='c';else if(m*2>al.length)g.winner='m';
 if(g.winner)g.phase='end';
}
function startNight(g){
 g.phase='night';g.night=g.day;g.np=1;g.dpos={};g.acts={};g.ainfo={};g.props=[];
 g.wait=alive(g).some(u=>g.pl[u].role==='drunk')?0:Date.now()+3000+Math.floor(Math.random()*2000); // fake Drunk step
}
function endDay(g){
 if(g.winner)return;
 if(g.day>=g.D){g.winner='m';g.phase='end'}
 else startNight(g);
}
function execMob(g,pr){
 const r=pr.room,v=alive(g).find(u=>g.pl[u].room===r);g.st[r]=v?'mob':'empty';g.props=[];
 if(v){g.pl[v].alive=false;g.log.push({k:'mobHit',p:{room:r,name:g.pl[v].name}});
  if(g.pl[v].role==='drunk'){g.winner='d';g.phase='end';return}
  checkWin(g)}
 else g.log.push({k:'mobEmpty',p:{room:r}});
 endDay(g);
}
function resolve(g,t){
 const al=alive(g),N=g.night,pos={},has=r=>al.filter(u=>g.pl[u].role===r),V=u=>g.acts[u];
 al.forEach(u=>pos[u]=posOf(g,u));
 const team=al.filter(u=>isM(g,u));
 has('house').forEach(u=>{const v=V(u);if(v)addInfo(g,u,'infoFloor',{floor:v,count:al.filter(x=>fl(pos[x])===v).length})});
 has('rac').forEach(u=>{const v=V(u);if(v)addInfo(g,u,'infoRow',{row:v,count:al.filter(x=>pos[x]%100===v).length})});
 has('det').forEach(u=>{const v=V(u);if(v&&pos[v]!==undefined)addInfo(g,u,'infoDet',{name:g.pl[v].name,floor:fl(pos[v])})});
 const locks=[];
 has('lock').forEach(u=>{const v=V(u)||null;if(v&&v!==g.lastLock[u])locks.push(v);g.lastLock[u]=v});
 const m=has('murd')[0];
 const blocked=!!(m&&t&&locks.some(x=>x===t||x===pos[m])); // locked target room, or the Murderer locked in
 let vic=[];
 if(m&&t){if(blocked)team.forEach(u=>addInfo(g,u,'infoLocked',{room:t}));
  else{vic=al.filter(u=>pos[u]===t);team.forEach(u=>addInfo(g,u,vic.length?'infoMurdDied':'infoMurdEmpty',{room:t,names:vic.map(x=>g.pl[x].name)}))}}
 has('wit').forEach(u=>{const wf=V(u);if(!wf)return;
  if(m&&t&&fl(t)===wf){const mf=fl(pos[m]);addInfo(g,u,'infoWitHit',{floor:wf,rel:mf===wf?'same':mf<wf?'lower':'higher'})}
  else addInfo(g,u,'infoWitMiss',{floor:wf})});
 vic.forEach(u=>g.pl[u].alive=false);
 if(m&&t&&!blocked){if(vic.length)g.st[t]='murdered';else if(!g.st[t])g.st[t]='empty'}
 g.log.push({k:'nightResult',p:{n:N,names:vic.map(u=>g.pl[u].name)}});
 delete g.dpos;delete g.acts;delete g.ainfo;g.wait=0;
 g.phase='day';g.day=N+1;g.props=[];checkWin(g);
}
function start(){
 const ids=Object.keys(HP).filter(u=>HP[u].name);const n=ids.length;
 if(n<5||n>9)return alert(L('Need 5 to 9 players.','ต้องมีผู้เล่น 5 ถึง 9 คน'));
 const cfg=HG.cfg,err=cfgErr(cfg,n);if(err)return alert(err);
 const pool=[];RK.forEach(r=>{for(let i=0;i<cfg[r];i++)pool.push(r)});
 const roles=['murd',...shuffle(pool).slice(0,n-1)];
 const rooms=[];for(let f=1;f<=n;f++)for(let c=1;c<=3;c++)rooms.push(f*100+c);
 const rr=shuffle(rooms).slice(0,n),rs=shuffle(roles);
 const g={host:uid,phase:'day',day:1,night:0,n,D:n<=6?3:4,pl:{},st:{},log:[{k:'dayStart',p:{bodies:n-4}}],info:{},seen:{},lastLock:{},props:[],cfg,banned:HG.banned};
 shuffle(ids).forEach((u,i)=>g.pl[u]={name:HP[u].name,room:rr[i],role:rs[i],alive:true});
 shuffle(rooms.filter(r=>!rr.includes(r))).slice(0,n-4).forEach(r=>g.st[r]='body');
 HG=g;tick();
}

  HG.cfg[r]=Math.min(9,Math.max(0,HG.cfg[r]+(+d)));ls('hm_cfg',JSON.stringify(HG.cfg));return tick()}
 if(a==='force'){force=true;return tick()}
 if(a==='sel'){sel=isNaN(v)?v:+v;return render()}
 if(a==='go'){const k=nightKind(G.pl[uid]);if(!k)return;mine={...mine,act:{n:G.night,p:G.np,v:k==='none'?0:sel}};sel=null;render();return push()}
 const keepVotes=()=>{const o={},ids=(G.props||[]).map(p=>p.id);for(const id in (mine.votes||{}))if(ids.includes(id))o[id]=mine.votes[id];return o};
 if(a==='prop'){const room=+document.getElementById('pr').value,seq=Date.now();
  mine={...mine,props:[...(mine.props||[]),{seq,room}].slice(-5),votes:{...keepVotes(),[uid+':'+seq]:true}};return push()}
 if(a==='vote'){mine={...mine,votes:{...keepVotes(),[b.dataset.id]:v==='1'}};return push()}
 if(a==='skip'){mine={...mine,skip:P[uid]?.skip===G.day?0:G.day};return push()}
});

/* ---------- boot ---------- */
(function(){
 const c=ls('hm_code');
 if(c&&name){
  if(ls('hm_host')==='1'){
   try{const s=JSON.parse(ls('hm_save'));HG=s.HG;HP=s.HP;startHost(c,true);return}catch(e){}
  }else return startClient(c);
 }
 ['hm_code','hm_host'].forEach(k=>ls(k,null));render();
})();
